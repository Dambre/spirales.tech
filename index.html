  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.querySelectorAll("[data-year]").forEach(function (e) {
        e.textContent = new Date().getFullYear();
      });
      document.addEventListener("click", function (event) {
        var pick = event.target.closest("[data-lang]");
        if (pick) {
          try { localStorage.setItem("lang", pick.getAttribute("data-lang")); } catch (e) {}
        }
        var link = event.target.closest(".svc-menu a");
        if (link) link.closest("details").removeAttribute("open");
      });
      document.addEventListener("click", function (event) {
        var button = event.target.closest("[data-copy]");
        if (!button) return;
        var text = button.getAttribute("data-copy");

        var idle = button.getAttribute("aria-label");
        function confirm() {
          button.classList.add("is-copied");
          button.setAttribute("aria-label", button.getAttribute("data-copied"));
          setTimeout(function () {
            button.classList.remove("is-copied");
            button.setAttribute("aria-label", idle);
          }, 1800);
        }

        function fallback() {
          var field = document.createElement("textarea");
          field.value = text;
          field.setAttribute("readonly", "");
          field.style.cssText = "position:fixed;top:0;left:-9999px";
          document.body.appendChild(field);
          field.select();
          var copied = false;
          try {
            copied = document.execCommand("copy");
          } catch (e) {
            copied = false;
          }
          document.body.removeChild(field);
          if (copied) confirm();
        }

        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(confirm, fallback);
        } else {
          fallback();
        }
      });
    </script>
  </body>
